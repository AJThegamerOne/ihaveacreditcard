name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Flake checks
        run: nix flake check

      - name: Python syntax
        run: nix develop --command python3 -m py_compile scripts/*.py

      - name: Rust crates
        run: |
          nix develop --command cargo check --manifest-path decryptor/ctrdecrypt/Cargo.toml
          nix develop --command cargo check --manifest-path decryptor/tui/Cargo.toml

      - name: Setup doctor
        run: nix run .#doctor
